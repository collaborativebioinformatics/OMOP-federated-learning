[project]
name = "synthea-nvflare-cox-demo"
version = "0.1.0"
description = "Federated PyTorch Cox PH demo using a normalized Synthea cohort"
requires-python = ">=3.10"
dependencies = [
    "nvflare>=2.9.0",
    "torch>=1.12.0",
    "numpy<2",
    "matplotlib>=3.7",
]

[tool.setuptools]
py-modules = [
    "build_dataset", "client", "data", "federate", "model", "run", "training", "visualize",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
